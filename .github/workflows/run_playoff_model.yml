name: Run Playoff Odds Simulation

on:
  workflow_run:
    workflows: ["Run dlt pipelines"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of Monte Carlo simulations'
        required: false
        default: '10000'
      week:
        description: 'Specific completed week to simulate (leave blank for auto)'
        required: false
        default: ''

jobs:
  check_schedule:
    name: Check Trigger & Schedule
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        name: Check if Tuesday or Manual Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # 1 = Monday, 2 = Tuesday, ..., 7 = Sunday (UTC)
            DAY=$(date -u +%u)
            if [ "$DAY" -ne 2 ]; then
              echo "Today is UTC day $DAY (not Tuesday). Skipping weekly playoff simulation."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Today is Tuesday. Upstream DLT pipeline succeeded. Proceeding with simulation."
          else
            echo "Manual workflow_dispatch triggered. Proceeding with simulation."
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

  run_simulation:
    name: Run Playoff Simulation
    needs: check_schedule
    if: needs.check_schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
      MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements_github_action.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github_action.txt

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Run Playoff Simulation
        run: |
          RUNS="${{ github.event.inputs.runs }}"
          WEEK="${{ github.event.inputs.week }}"
          CMD="python scripts/simulate_playoffs.py"
          if [ -n "$RUNS" ]; then
            CMD="$CMD --runs $RUNS"
          else
            CMD="$CMD --runs 10000"
          fi
          if [ -n "$WEEK" ]; then
            CMD="$CMD --week $WEEK"
          fi
          echo "Executing: $CMD"
          $CMD
